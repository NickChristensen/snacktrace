services:
  snacktrace:
    build: .
    environment:
      FOODNOMS_DB_PATH: /foodnoms/db.db
      HOST: 0.0.0.0
      PORT: "3000"
    volumes:
      - ${FOODNOMS_DIR:?Set FOODNOMS_DIR to FoodNoms Documents directory}:/foodnoms:ro
    ports:
      - 127.0.0.1:${PORT:-3000}:3000
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
